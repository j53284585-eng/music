<!DOCTYPE html>

<title>LIL PEEP & Meeting Chance — Changes</title>

<style>
@font-face {
  font-family: 'sahel';
  src: url('fonts/Sahel-Black.ttf') format('truetype');
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'sahel', sans-serif;
  background: radial-gradient(circle at top, #1a0000, #000);
  color: #fff;
  min-height: 100vh;
  transition: background 0.6s ease;
}

header {
  padding: 60px 20px;
  text-align: center;
}

header h1 {
  font-size: 52px;
  color: #ff2b2b;
  text-shadow: 0 0 30px rgba(255,0,0,0.8);
}

header p {
  color: #aaa;
  margin-top: 12px;
  letter-spacing: 3px;
}

.songs-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 35px;
  padding: 40px;
  max-width: 1200px;
  margin: auto;
}

.song-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(14px);
  border-radius: 22px;
  padding: 18px;
  transition: 0.4s ease;
}

.song-card:hover {
  transform: translateY(-12px) scale(1.05);
}

.song-card.playing {
  box-shadow: 0 0 35px rgba(255,0,0,0.9);
}

.cover-wrapper {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 14px;
}

.song-cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.song-card.playing .song-cover {
  transform: scale(1.12) rotate(-1deg);
}

.song-title {
  font-size: 15px;
  color: #ff6b6b;
  margin-bottom: 10px;
}

audio { width: 100%; }

.download-btn {
  display: block;
  margin-top: 12px;
  padding: 11px;
  text-align: center;
  border-radius: 12px;
  background: linear-gradient(90deg, #ff0000, #900);
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.download-btn:hover {
  background: #fff;
  color: #000;
  transform: scale(1.05);
}
</style>
</head>

<script>
const audios = document.querySelectorAll('audio');
const cards = document.querySelectorAll('.song-card');

audios.forEach(audio => {
  audio.addEventListener('play', () => {
    audios.forEach(a => {
      if (a !== audio) {
        a.pause();
        a.parentElement.classList.remove('playing');
      }
    });
    const card = audio.parentElement;
    cards.forEach(c => c.classList.remove('playing'));
    card.classList.add('playing');
    document.body.style.background = card.dataset-bg;
  });
});
</script>
