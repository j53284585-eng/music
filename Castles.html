<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>LIL PEEP & Lil Tracy — Castles</title>

<style>
@font-face {
  font-family: 'sahel';
  src: url('fonts/Sahel-Black.ttf') format('truetype');
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'sahel', sans-serif;
  background: radial-gradient(circle at top, #1a0000, #000);
  color: #fff;
  min-height: 100vh;
  transition: background 0.6s ease;
}

header {
  padding: 60px 20px;
  text-align: center;
}

header h1 {
  font-size: 54px;
  color: #ff2b2b;
  text-shadow: 0 0 30px rgba(255,0,0,0.8);
}

header p {
  color: #aaa;
  margin-top: 12px;
  letter-spacing: 3px;
}

.songs-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 35px;
  padding: 40px;
  max-width: 1100px;
  margin: auto;
}

.song-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(14px);
  border-radius: 22px;
  padding: 18px;
  transition: 0.4s ease;
}

.song-card:hover {
  transform: translateY(-12px) scale(1.05);
}

.song-card.playing {
  box-shadow: 0 0 35px rgba(255,0,0,0.9);
}

.cover-wrapper {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 14px;
}

.song-cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.song-card.playing .song-cover {
  transform: scale(1.12) rotate(-1deg);
}

.song-title {
  font-size: 15px;
  color: #ff6b6b;
  margin-bottom: 10px;
}

audio { width: 100%; }

.download-btn {
  display: block;
  margin-top: 12px;
  padding: 11px;
  text-align: center;
  border-radius: 12px;
  background: linear-gradient(90deg, #ff0000, #900);
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.download-btn:hover {
  background: #fff;
  color: #000;
  transform: scale(1.05);
}
</style>
</head>

<body>

<header>
  <h1>Castles</h1>
  <p>LIL PEEP & Lil Tracy • 2016</p>
</header>

<div class="songs-container">

<!-- 01 -->
<div class="song-card" data-bg="radial-gradient(circle,#330000,#000)">
  <div class="cover-wrapper">
    <img class="song-cover" src="https://media.pitchfork.com/photos/60e47733331c9bf60f4b0c08/master/pass/100000x100000-999.jpeg">
  </div>
  <div class="song-title">01 — Castles</div>
  <audio controls src="Lil-Peep-Lil-Tracy-castles-320.mp3"></audio>
  <a class="download-btn" href="Lil-Peep-Lil-Tracy-castles-320.mp3" download>⬇ Download</a>
</div>

<!-- 02 -->
<div class="song-card" data-bg="radial-gradient(circle,#550000,#000)">
  <div class="cover-wrapper">
    <img class="song-cover" src="https://media.pitchfork.com/photos/60e47733331c9bf60f4b0c08/master/pass/100000x100000-999.jpeg">
  </div>
  <div class="song-title">02 — Pain (ft. Slug Christ)</div>
  <audio controls src="Lil-Peep-Lil-Tracy-pain-(Ft-Slug-Christ)-320.mp3"></audio>
  <a class="download-btn" href="Lil-Peep-Lil-Tracy-pain-(Ft-Slug-Christ)-320.mp3" download>⬇ Download</a>
</div>

<!-- 03 -->
<div class="song-card" data-bg="radial-gradient(circle,#770000,#000)">
  <div class="cover-wrapper">
    <img class="song-cover" src="https://media.pitchfork.com/photos/60e47733331c9bf60f4b0c08/master/pass/100000x100000-999.jpeg">
  </div>
  <div class="song-title">03 — White Wine</div>
  <audio controls src="Lil-Peep-Lil-Tracy-white-wine-320.mp3"></audio>
  <a class="download-btn" href="Lil-Peep-Lil-Tracy-white-wine-320.mp3" download>⬇ Download</a>
</div>

</div>

<script>
const audios = document.querySelectorAll('audio');
const cards = document.querySelectorAll('.song-card');

audios.forEach(audio => {
  audio.addEventListener('play', () => {
    audios.forEach(a => {
      if (a !== audio) {
        a.pause();
        a.parentElement.classList.remove('playing');
      }
    });
    const card = audio.parentElement;
    cards.forEach(c => c.classList.remove('playing'));
    card.classList.add('playing');
    document.body.style.background = card.dataset-bg;
  });
});
</script>

</body>
</html>
